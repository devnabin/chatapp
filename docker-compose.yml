services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      # Keep the flat-file DB on the host so it survives rebuilds
      DATABASE: /app/data/database.txt
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped
